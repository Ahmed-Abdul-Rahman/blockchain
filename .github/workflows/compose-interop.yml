# Tier 2 Compose interop — Dockerized late-joiner + netem + A/B on GitHub-hosted runners.
# Path-filtered on PRs so unrelated changes stay on the fast worker-thread CI gate.
name: Compose Interop

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'packages/core/tests/compose-interop/**'
      - 'packages/core/tests/interop/nodeRunner.ts'
      - 'packages/core/tests/interop/childThread/workerUitls.ts'
      - 'packages/core/tests/interop/types.ts'
      - 'packages/core/package.json'
      - 'packages/chat/package.json'
      - '.github/workflows/compose-interop.yml'
      - '.github/workflows/compose-interop-nightly.yml'
      - '.dockerignore'
  workflow_dispatch:
    inputs:
      compose_nodes:
        description: 'Total nodes (producers + 1 late joiner)'
        required: false
        default: '7'
      adaptive_enabled:
        description: 'ADAPTIVE_ENABLED (single late-joiner jobs)'
        required: false
        default: 'true'
      run_wan_vs_lan:
        description: 'Also run lan-then-wan wall-time multiplier check'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

concurrency:
  group: compose-interop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PR C: lan baseline + wan netem + fixed/heuristic A/B in parallel.
  late-joiner:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        netem_profile: [lan, wan]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Docker availability
        run: |
          docker version
          docker compose version

      - name: Compose late-joiner (${{ matrix.netem_profile }})
        env:
          COMPOSE_NODES: ${{ github.event.inputs.compose_nodes || '7' }}
          ADAPTIVE_ENABLED: ${{ github.event.inputs.adaptive_enabled || 'true' }}
          SCHEDULER: heuristic
          SYNC_INTERVAL_MS: '15000'
          NETEM_PROFILE: ${{ matrix.netem_profile }}
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: yarn workspace @dechat/core test:compose:late-joiner

      - name: Upload Compose reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-late-joiner-${{ matrix.netem_profile }}
          path: packages/core/tests/compose-interop/reports/
          if-no-files-found: ignore

      - name: Teardown Compose leftovers
        if: always()
        run: |
          for i in $(seq 0 31); do docker rm -f "dechat-node-${i}" >/dev/null 2>&1 || true; done
          docker compose -p dechat-compose-interop \
            -f packages/core/tests/compose-interop/docker-compose.yml \
            down -v --remove-orphans || true

  dormant-room-ab:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Docker availability
        run: |
          docker version
          docker compose version

      - name: Compose A/B (fixed vs heuristic, lan)
        env:
          COMPOSE_NODES: ${{ github.event.inputs.compose_nodes || '7' }}
          SYNC_INTERVAL_MS: '15000'
          NETEM_PROFILE: lan
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: yarn workspace @dechat/core test:compose:ab

      - name: Upload Compose A/B reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-dormant-room-ab
          path: packages/core/tests/compose-interop/reports/
          if-no-files-found: ignore

      - name: Teardown Compose leftovers
        if: always()
        run: |
          for i in $(seq 0 31); do docker rm -f "dechat-node-${i}" >/dev/null 2>&1 || true; done
          docker compose -p dechat-compose-interop \
            -f packages/core/tests/compose-interop/docker-compose.yml \
            down -v --remove-orphans || true

  split-brain:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Docker availability
        run: |
          docker version
          docker compose version

      - name: Compose split-brain heal (6 nodes)
        env:
          COMPOSE_NODES: '6'
          ADAPTIVE_ENABLED: 'true'
          SCHEDULER: heuristic
          SYNC_INTERVAL_MS: '15000'
          NETEM_PROFILE: lan
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: yarn workspace @dechat/core test:compose:split-brain

      - name: Upload Compose split-brain reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-split-brain
          path: packages/core/tests/compose-interop/reports/
          if-no-files-found: ignore

      - name: Teardown Compose leftovers
        if: always()
        run: |
          for i in $(seq 0 31); do docker rm -f "dechat-node-${i}" >/dev/null 2>&1 || true; done
          docker compose -p dechat-compose-interop \
            -f packages/core/tests/compose-interop/docker-compose.yml \
            down -v --remove-orphans || true

  wan-vs-lan:
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_wan_vs_lan == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Compose wan-vs-lan (≤2× wall)
        env:
          COMPOSE_NODES: ${{ github.event.inputs.compose_nodes || '7' }}
          ADAPTIVE_ENABLED: ${{ github.event.inputs.adaptive_enabled || 'true' }}
          SCHEDULER: heuristic
          SYNC_INTERVAL_MS: '15000'
          WAN_MAX_LAN_MULTIPLIER: '2'
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: yarn workspace @dechat/core test:compose:wan-vs-lan

      - name: Upload wan-vs-lan reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-wan-vs-lan
          path: packages/core/tests/compose-interop/reports/
          if-no-files-found: ignore

      - name: Teardown Compose leftovers
        if: always()
        run: |
          for i in $(seq 0 31); do docker rm -f "dechat-node-${i}" >/dev/null 2>&1 || true; done
          docker compose -p dechat-compose-interop \
            -f packages/core/tests/compose-interop/docker-compose.yml \
            down -v --remove-orphans || true

name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # use LTS; align with your local version
          cache: 'yarn' # enables Yarn cache

      - name: Install dependencies
        run: |
          yarn install --immutable   # Yarn Berry; use `--frozen-lockfile` for Yarn 1

      - name: Build packages
        run: |
          yarn build

      - name: Run tests
        run: |
          yarn test

name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run unit tests
        run: yarn test

      - name: Guard browser bundles against Node-only deps
        run: yarn test:browser-bundle

  integration-tests-startup:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Run interop startup tests
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: yarn test:int:startup

  integration-tests-data-sync:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: yarn build

      - name: Run interop data sync tests
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
          ADAPTIVE_INTEROP_STRICT: "true"
        run: yarn test:int:data-sync

  chat-interop:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run @dechat/chat unit tests
        run: yarn workspace @dechat/chat test

      - name: Run ChatClient interop
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: yarn test:int:chat

  browser-gates:
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable Corepack (Yarn 4)
        run: |
          corepack enable
          corepack prepare yarn@4.12.0 --activate

      - name: Install dependencies
        run: yarn install --immutable

      - name: Hybrid Node↔browser-stack smoke
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: yarn test:int:hybrid-browser-stack

      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium

      - name: Real-browser auth/registry smoke
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: yarn test:playwright
